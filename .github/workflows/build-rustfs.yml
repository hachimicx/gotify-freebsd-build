name: build-rustfs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'rustfs/rustfs ref to build (tag, branch or commit)'
        required: false
        default: '1.0.0-rc.5'
      version:
        description: 'Version string for artifact naming'
        required: false
        default: '1.0.0-rc.5'

jobs:
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout rustfs/rustfs
        uses: actions/checkout@v7
        with:
          repository: rustfs/rustfs
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          envs: 'VERSION'
          prepare: |
            pkg install -y rust cmake perl5 zip pkgconf git
          run: |
            set -eu
            echo "building on $(freebsd-version) with $(rustc --version)"

            # MSRV check from workspace Cargo.toml; fall back to rustup if pkg rust is older
            NEED=$(awk -F'"' '/^rust-version/ {print $2; exit}' Cargo.toml)
            HAVE=$(rustc --version | awk '{print $2}')
            echo "MSRV=${NEED} have=${HAVE}"
            if [ "$(printf '%s\n' "$NEED" "$HAVE" | sort -V | head -1)" != "$NEED" ]; then
              echo "pkg rust too old -> installing stable via rustup"
              fetch https://sh.rustup.rs -o /tmp/rustup.sh
              sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
              echo "now using $(rustc --version)"
            fi

            export CARGO_TARGET_DIR=/tmp/rustfs-target
            cargo build --release -p rustfs

            mkdir -p build
            cp /tmp/rustfs-target/release/rustfs build/rustfs-freebsd-amd64
            chmod +x build/rustfs-freebsd-amd64
            file build/rustfs-freebsd-amd64
            ls -lh build/
            (timeout 20 ./build/rustfs-freebsd-amd64 --version || true) | head -3

            zip -j "build/rustfs-freebsd-amd64-${VERSION}.zip" build/rustfs-freebsd-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustfs-freebsd-amd64-${{ inputs.version }}
          path: build/rustfs-freebsd-amd64-${{ inputs.version }}.zip
          if-no-files-found: error
